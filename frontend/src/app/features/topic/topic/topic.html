<svg:rect [attr.width]="width" [attr.height]="height" rx="8" ry="8" fill="white"
          [attr.stroke]="selected() ? '#ff4081' : '#673ab7'" [attr.stroke-width]="selected() ? 3 : 2" />
<svg:text [attr.x]="width / 2" [attr.y]="height / 2 + 5" text-anchor="middle" font-size="14" fill="#333" style="pointer-events: none;">
  {{ topic().emoji }} {{ topic().title }}
</svg:text>
