<svg:rect class="topic-node" [class.topic-node--selected]="selected()"
          [attr.width]="width" [attr.height]="height" rx="6" ry="6" />
<svg:text class="topic-node__label" [attr.x]="width / 2" [attr.y]="height / 2 + 5" text-anchor="middle">
  {{ topic().emoji }} {{ topic().title }}
</svg:text>
