<svg:rect [attr.width]="width" [attr.height]="height" rx="8" ry="8" fill="white" stroke="#673ab7" stroke-width="2" />
<svg:text [attr.x]="width / 2" [attr.y]="height / 2 + 5" text-anchor="middle" font-size="14" fill="#333" style="pointer-events: none;">
  {{ topic().emoji }} {{ topic().title }}
</svg:text>
