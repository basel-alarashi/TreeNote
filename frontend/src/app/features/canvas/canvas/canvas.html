<div #container
     class="canvas-container"
     (wheel)="onWheel($event)"
     (mousedown)="onBackgroundMouseDown($event)"
     (mousemove)="onBackgroundMouseMove($event)"
     (mouseup)="onBackgroundMouseUp($event)"
     (mouseleave)="onBackgroundMouseUp($event)"
     (touchstart)="onBackgroundTouchStart($event)"
     (touchmove)="onBackgroundTouchMove($event)"
     (touchend)="onBackgroundTouchEnd($event)"
     (touchcancel)="onBackgroundTouchEnd($event)">
  <div class="toolbar">
    <app-connection-status-badge [lastSyncedAt]="lastSyncedAt()"></app-connection-status-badge>
    <app-search-bar (resultSelected)="onSearchResultSelected($event)"></app-search-bar>
    <app-export-menu [svgElement]="svgElement!" [canvasName]="name()"></app-export-menu>
    <button mat-icon-button [disabled]="!history.canUndo()" (click)="history.undo()" matTooltip="Undo" aria-label="Undo"><mat-icon>undo</mat-icon></button>
    <button mat-icon-button [disabled]="!history.canRedo()" (click)="history.redo()" matTooltip="Redo" aria-label="Redo"><mat-icon>redo</mat-icon></button>
    <button mat-icon-button (click)="zoomIn()" matTooltip="Zoom in" aria-label="Zoom in"><mat-icon>zoom_in</mat-icon></button>
    <button mat-icon-button (click)="zoomOut()" matTooltip="Zoom out" aria-label="Zoom out"><mat-icon>zoom_out</mat-icon></button>
    <button mat-icon-button (click)="resetView()" matTooltip="Reset view" aria-label="Reset view"><mat-icon>center_focus_strong</mat-icon></button>
    <button mat-icon-button (click)="fitToScreen()" matTooltip="Fit to screen" aria-label="Fit to screen"><mat-icon>fit_screen</mat-icon></button>
  </div>

  <svg class="canvas-svg" #canvasSvg>
    <g [attr.transform]="viewport.transform()">
      @for (rel of visibleRelationships(); track rel.parentId + rel.childId) {
      <svg:path appConnector [parent]="topicById(rel.parentId)" [child]="topicById(rel.childId)"></svg:path>
      }
      @for (topic of visibleTopics(); track topic.id) {
      <svg:g appTopic [topic]="topic" [selected]="selection.isSelected(topic.id)"
             tabindex="0"
             role="button"
             [attr.aria-label]="topic.title + (selection.isSelected(topic.id) ? ' (selected)' : '')"
             [attr.aria-pressed]="selection.isSelected(topic.id)"
             (mousedown)="onTopicMouseDown($event, topic)"
             (touchstart)="onTopicTouchStart($event, topic)"
             (touchmove)="onTopicTouchMove($event)"
             (touchend)="onTopicTouchEnd($event)"
             (touchcancel)="onTopicTouchEnd($event)"
             (keydown)="onTopicKeydown($event, topic)"
             (contextmenu)="onTopicContextMenu($event, topic)"></svg:g>
      }
      @if (selectionBoxRect(); as box) {
      <svg:rect appSelectionBox [box]="box"></svg:rect>
      }
    </g>
  </svg>

  <div class="context-menu-anchor" [style.left.px]="contextMenuPosition().x" [style.top.px]="contextMenuPosition().y"
       [matMenuTriggerFor]="topicMenu" #menuTrigger="matMenuTrigger"></div>

  <mat-menu #topicMenu="matMenu" class="tn-context-menu" (closed)="onContextMenuClosed()">
    <button mat-menu-item (click)="addChild()"><mat-icon>add</mat-icon> Add Child</button>
    <button mat-menu-item (click)="addSibling()"><mat-icon>add_box</mat-icon> Add Sibling</button>
    <button mat-menu-item (click)="renameFromMenu()"><mat-icon>edit</mat-icon> Rename (F2)</button>
    <button mat-menu-item (click)="duplicateFromMenu()"><mat-icon>content_copy</mat-icon> Duplicate</button>
    <button mat-menu-item (click)="deleteFromMenu()"><mat-icon>delete</mat-icon> Delete</button>
  </mat-menu>
</div>
