@if (canvas(); as c) {
<h1>{{ c.name }}</h1>

<div class="canvas-viewport">
  <app-canvas [topics]="c.topics"
              [relationships]="c.relationships"
              (positionsChanged)="onPositionsChanged($event)"
              (dragEnded)="onDragEnded($event)" />
</div>

<div class="create-row">
  <mat-form-field appearance="outline">
    <mat-label>New root topic</mat-label>
    <input matInput [(ngModel)]="newRootTitle" (keyup.enter)="addRoot()" />
  </mat-form-field>
  <button mat-raised-button color="primary" (click)="addRoot()">Add Root Topic</button>
</div>

  @for (topic of c.topics; track topic.id) {
<app-topic-item [topic]="topic"
                (rename)="rename($event)"
                (delete)="remove($event)"
                (duplicate)="duplicate($event)"
                (addChild)="startAddChild($event)" />

    @if (addingChildFor === topic.id) {
<div class="create-row">
  <mat-form-field appearance="outline">
    <mat-label>Child title</mat-label>
    <input matInput [(ngModel)]="newChildTitle" (keyup.enter)="confirmAddChild()" />
  </mat-form-field>
  <button mat-raised-button (click)="confirmAddChild()">Add</button>
</div>
    }
  }
} @else {
<p>Loading...</p>
}
